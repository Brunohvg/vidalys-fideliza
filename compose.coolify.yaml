# LEGADO / CI: banco embutido. NAO usar no Coolify do Vidalys Fideliza atual.
# Homologacao real com PostgreSQL separado: compose.coolify.external-db.yaml.
# Testes de regressao ainda exercitam esta stack local isolada.
# Sem name/container_name/ports/redes externas: Coolify atribui o namespace unico.
# Manter Connect to predefined network e automatic deployments desabilitados.
# Compartilhado entre API e worker sem segredos da Nuvemshop.
x-django-env: &django_env
  DJANGO_SECRET_KEY: ${FIDELIZA_DJANGO_SECRET_KEY:?}
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,${FIDELIZA_STAGING_HOST:?}
  DJANGO_CSRF_TRUSTED_ORIGINS: https://${FIDELIZA_STAGING_HOST:?}
  DJANGO_SECURE_SSL_REDIRECT: "1"
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: fideliza_homolog
  DB_USER: fideliza_homolog
  DB_PASSWORD: ${FIDELIZA_DB_PASSWORD:?}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.35
    environment:
      POSTGRES_DB: fideliza_homolog
      POSTGRES_USER: fideliza_homolog
      POSTGRES_PASSWORD: ${FIDELIZA_DB_PASSWORD:?}
    volumes:
      - fideliza_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fideliza_homolog -d fideliza_homolog"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: &bounded_logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.15
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - fideliza_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *bounded_logs

  api:
    build: ./backend
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.50
    environment:
      <<: *django_env
      NUVEMSHOP_CLIENT_ID: ${NUVEMSHOP_CLIENT_ID:-}
      NUVEMSHOP_CLIENT_SECRET: ${NUVEMSHOP_CLIENT_SECRET:-}
      NUVEMSHOP_TOKEN_KEYS: ${NUVEMSHOP_TOKEN_KEYS:-}
      NUVEMSHOP_OAUTH_CALLBACK_URL: ${NUVEMSHOP_OAUTH_CALLBACK_URL:-}
      NUVEMSHOP_API_USER_AGENT: ${NUVEMSHOP_API_USER_AGENT:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        python manage.py migrate --noinput
        exec gunicorn config.wsgi:application --workers 1 --threads 2 --bind 0.0.0.0:8000 --access-logfile - --access-logformat '%(h)s %(U)s %(s)s'
    healthcheck:
      # TLS termina no proxy; este healthcheck local precisa indicar HTTPS.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/ready/', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(r, timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *bounded_logs

  worker:
    build: ./backend
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    environment: *django_env
    depends_on:
      api:
        condition: service_healthy
    command: celery -A config worker --loglevel=INFO --concurrency=1
    logging: *bounded_logs

  frontend:
    build: ./frontend
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.10
    expose:
      - "8080"
    depends_on:
      api:
        condition: service_healthy
    logging: *bounded_logs

volumes:
  fideliza_postgres_data:
  fideliza_redis_data:
