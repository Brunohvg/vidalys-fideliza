[project]
name = "vidalys-fideliza-backend"
version = "0.1.0"
description = "API multi-tenant do Vidalys Fideliza"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
    "psycopg[binary]>=3.2,<3.4",
    "celery[redis]>=5.5,<5.7",
    "gunicorn>=23,<24",
    "whitenoise>=6.8,<7",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-django>=4.11,<5",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["apps"]

[tool.ruff]
target-version = "py312"
line-length = 110
