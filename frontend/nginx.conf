limit_req_zone $binary_remote_addr zone=fideliza_login:10m rate=10r/m;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header X-Robots-Tag "noindex, nofollow" always;

  # Guarda conservadora por peer: atras do Coolify agrega os acessos do proxy.
  # Nao confiar em um X-Forwarded-For enviado diretamente pelo cliente.
  location = /api/v1/auth/login/ {
    limit_req zone=fideliza_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
  }
  # /admin sem barra anteriormente caia no fallback SPA.
  location = /admin {
    return 308 /admin/;
  }
  # Limitar pedidos publicos de cadastro e recuperação na borda.
  location ~ ^/api/v1/auth/(register|register/resend|password-reset/request)/$ {
    limit_req zone=fideliza_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location = /admin/login/ {
    limit_req zone=fideliza_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Callback OAuth contém code e state na query: nunca registrar URL completa.
  location = /api/v1/oauth/nuvemshop/callback/ {
    access_log off;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /admin/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }
  location /static/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }
  location /assets/ {
    try_files $uri =404;
    expires 1d;
  }
  location / { try_files $uri $uri/ /index.html; }
}
