name: temporary-uv-lock-refresh
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  refresh:
    if: ${{ github.head_ref == 'feat/nuvemshop-oauth-readonly-v1' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
      - name: Generate pinned uv.lock for cryptography on Python 3.12
        run: cd backend && uv lock --python 3.12
      - name: Commit generated lock only to this feature branch
        run: |
          if ! git diff --quiet -- backend/uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/uv.lock
            git commit -m "build: regenerate uv lock for OAuth encryption"
            git push origin HEAD:refs/heads/feat/nuvemshop-oauth-readonly-v1
          fi
