name: quality
on:
  pull_request:
  push:
    branches: [main, homolog]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: test-key-only-not-for-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --locked --python 3.12
      - run: uv run --locked python manage.py check
      - run: uv run --locked python manage.py makemigrations --check --dry-run
      - run: uv run --locked pytest -q
      - run: uv run --locked python -m compileall -q .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

  docker_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compose único, banco externo e healthchecks
        run: python .github/scripts/ci_single_compose.py --mode basic

  visual_qa:
    # Playwright 1.56 é suportado em Ubuntu 24.04; ubuntu-latest pode usar 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      # Chrome já vem instalado no runner Ubuntu 24.04.
      # Não baixar navegadores nem executar apt-get no job visual.
      - run: npm run test:e2e
      - name: Screenshots e traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: margin-visual-qa
          path: frontend/test-results
          retention-days: 14
          if-no-files-found: ignore

  coolify_compose_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: HTTPS, sessão, CSRF e worker no Compose único
        run: python .github/scripts/ci_single_compose.py --mode proxy

  external_database_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 'Raw Compose - isolamento + controle negativo da injeção Coolify Managed'
        run: python .github/scripts/check_coolify_env_isolation.py
      - name: PostgreSQL independente, auditoria de env e autenticação
        run: python .github/scripts/ci_single_compose.py --mode full
