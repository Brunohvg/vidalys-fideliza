# Stack unica: Redis, API, worker, frontend; PostgreSQL independente.
# Coolify: selecionar o destino privado fideliza-homolog e habilitar
# Connect to predefined network SOMENTE para esse destino.
# CI: postgres descartavel separado, conectado a rede interna do Compose.
# Nenhuma porta publica ou banco gerenciado pela stack.
# Coolify gerenciado injeta env_file: .env em TODOS os serviços.
# Valores vazios explícitos prevalecem sobre esse arquivo. Cada serviço abaixo
# libera somente as credenciais que realmente utiliza.
x-block-inherited-credentials: &blocked_credentials
  # O Coolify pode injetar env_file global em TODOS os serviços.
  # Sobrescrever explicitamente tudo que não pertence ao container.
  DATABASE_URL: ""
  DJANGO_SECRET_KEY: ""
  DJANGO_ALLOWED_HOSTS: ""
  DJANGO_CSRF_TRUSTED_ORIGINS: ""
  DJANGO_DEBUG: ""
  DJANGO_SECURE_SSL_REDIRECT: ""
  DB_HOST: ""
  DB_PORT: ""
  DB_NAME: ""
  DB_USER: ""
  DB_PASSWORD: ""
  POSTGRES_USER: ""
  POSTGRES_DB: ""
  POSTGRES_PASSWORD: ""
  REDIS_URL: ""
  CELERY_BROKER_URL: ""
  NUVEMSHOP_CLIENT_ID: ""
  NUVEMSHOP_CLIENT_SECRET: ""
  NUVEMSHOP_TOKEN_KEYS: ""
  NUVEMSHOP_OAUTH_CALLBACK_URL: ""
  NUVEMSHOP_API_USER_AGENT: ""
  FIDELIZA_PUBLIC_SIGNUP_ENABLED: ""
  FIDELIZA_NUVEMSHOP_CUSTOMERS_PREVIEW_ENABLED: ""
  FIDELIZA_NUVEMSHOP_ORDERS_PREVIEW_ENABLED: ""
  FIDELIZA_NUVEMSHOP_ORDER_WEBHOOKS_ENABLED: ""
  FIDELIZA_PARTICIPANT_APPROVAL_ENABLED: ""
  FIDELIZA_AUTO_CUSTOMER_LINK_ENABLED: ""
  FIDELIZA_EMAIL_DELIVERY_ENABLED: ""
  FIDELIZA_PUBLIC_BASE_URL: ""
  FIDELIZA_LEDGER_WRITES_ENABLED: ""
  EMAIL_BACKEND: ""
  EMAIL_HOST: ""
  EMAIL_PORT: ""
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""
  EMAIL_USE_TLS: ""
  EMAIL_USE_SSL: ""
  DEFAULT_FROM_EMAIL: ""
  SERVER_EMAIL: ""
  # Variáveis herdadas de stacks antigas e testes, jamais usadas no runtime.
  FIDELIZA_DATABASE_URL: ""
  FIDELIZA_DJANGO_SECRET_KEY: ""
  FIDELIZA_DB_PASSWORD: ""
  SERVICE_PASSWORD_64_DJANGO: ""
  FIDELIZA_HOMOLOG_LOGIN_PASSWORD: ""
  FIDELIZA_TEST_ADMIN_PASSWORD: ""
  FIDELIZA_STAGING_HOST: ""
  FRONTEND_PORT: ""
  FIDELIZA_SMOKE_HOMOLOG: ""
  FIDELIZA_CI_ISOLATED: ""

# Compartilhado entre API e worker sem segredos da Nuvemshop/SMTP herdados.
x-django-env: &django_env
  <<: *blocked_credentials
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?}
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?}
  DJANGO_SECURE_SSL_REDIRECT: "1"
  DATABASE_URL: ${DATABASE_URL:?}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1

services:
  redis:
    image: redis:7-alpine
    environment: *blocked_credentials
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.15
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - fideliza_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: &bounded_logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build: ./backend
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.50
    environment:
      <<: *django_env
      NUVEMSHOP_CLIENT_ID: ${NUVEMSHOP_CLIENT_ID:-}
      NUVEMSHOP_CLIENT_SECRET: ${NUVEMSHOP_CLIENT_SECRET:-}
      NUVEMSHOP_TOKEN_KEYS: ${NUVEMSHOP_TOKEN_KEYS:-}
      NUVEMSHOP_OAUTH_CALLBACK_URL: ${NUVEMSHOP_OAUTH_CALLBACK_URL:-}
      NUVEMSHOP_API_USER_AGENT: ${NUVEMSHOP_API_USER_AGENT:-}
      # Bloqueio de inscrições com PII até revisão e autorização da homologação.
      FIDELIZA_PUBLIC_SIGNUP_ENABLED: ${FIDELIZA_PUBLIC_SIGNUP_ENABLED:-0}
      FIDELIZA_EMAIL_DELIVERY_ENABLED: ${FIDELIZA_EMAIL_DELIVERY_ENABLED:-0}
      FIDELIZA_PUBLIC_BASE_URL: ${FIDELIZA_PUBLIC_BASE_URL:-}
      FIDELIZA_NUVEMSHOP_CUSTOMERS_PREVIEW_ENABLED: ${FIDELIZA_NUVEMSHOP_CUSTOMERS_PREVIEW_ENABLED:-0}
      FIDELIZA_NUVEMSHOP_ORDERS_PREVIEW_ENABLED: ${FIDELIZA_NUVEMSHOP_ORDERS_PREVIEW_ENABLED:-0}
      FIDELIZA_NUVEMSHOP_ORDER_WEBHOOKS_ENABLED: ${FIDELIZA_NUVEMSHOP_ORDER_WEBHOOKS_ENABLED:-0}
      FIDELIZA_PARTICIPANT_APPROVAL_ENABLED: ${FIDELIZA_PARTICIPANT_APPROVAL_ENABLED:-0}
      FIDELIZA_AUTO_CUSTOMER_LINK_ENABLED: ${FIDELIZA_AUTO_CUSTOMER_LINK_ENABLED:-0}
    depends_on:
      redis:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        python manage.py migrate --noinput
        exec gunicorn config.wsgi:application --workers 1 --threads 2 --bind 0.0.0.0:8000 --access-logfile - --access-logformat '%(h)s %(U)s %(s)s'
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/ready/', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(r, timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *bounded_logs

  worker:
    build: ./backend
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    environment:
      <<: *django_env
      # Credenciais SMTP somente no worker; API nunca recebe EMAIL_HOST_PASSWORD.
      FIDELIZA_EMAIL_DELIVERY_ENABLED: ${FIDELIZA_EMAIL_DELIVERY_ENABLED:-0}
      FIDELIZA_PUBLIC_BASE_URL: ${FIDELIZA_PUBLIC_BASE_URL:-}
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: "587"
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: "1"
      EMAIL_USE_SSL: "0"
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      # O email técnico usa o mesmo remetente, sem variável duplicada.
      SERVER_EMAIL: ${DEFAULT_FROM_EMAIL:-}
    depends_on:
      api:
        condition: service_healthy
    command: celery -A config worker --loglevel=INFO --concurrency=1
    logging: *bounded_logs

  frontend:
    build: ./frontend
    environment: *blocked_credentials
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.10
    expose:
      - "8080"
    depends_on:
      api:
        condition: service_healthy
    logging: *bounded_logs

volumes:
  fideliza_redis_data:
