# FIDELIZA: Compose unico, apenas para Coolify RAW (deploy file as-is)
# O modo Managed injeta env_file global e foi reprovado na auditoria real.
# Redes e rotas Traefik declaradas no arquivo. PostgreSQL externo.
# Conferir proxy, redes Docker e backup antes de habilitar Raw e implantar.
# Variaveis compartilhadas somente entre os processos Django.
x-django-env: &django_env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?}
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?}
  DJANGO_SECURE_SSL_REDIRECT: "1"
  DATABASE_URL: ${DATABASE_URL:?}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1

services:
  redis:
    image: redis:7-alpine
    networks: [app]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.15
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - fideliza_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: &bounded_logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build: ./backend
    restart: unless-stopped
    networks: [app, database]
    mem_limit: 512m
    cpus: 0.50
    environment:
      <<: *django_env
      NUVEMSHOP_CLIENT_ID: ${NUVEMSHOP_CLIENT_ID:-}
      NUVEMSHOP_CLIENT_SECRET: ${NUVEMSHOP_CLIENT_SECRET:-}
      NUVEMSHOP_TOKEN_KEYS: ${NUVEMSHOP_TOKEN_KEYS:-}
      NUVEMSHOP_OAUTH_CALLBACK_URL: ${NUVEMSHOP_OAUTH_CALLBACK_URL:-}
      NUVEMSHOP_API_USER_AGENT: ${NUVEMSHOP_API_USER_AGENT:-}
      # Bloqueio de inscrições com PII até revisão e autorização da homologação.
      FIDELIZA_PUBLIC_SIGNUP_ENABLED: ${FIDELIZA_PUBLIC_SIGNUP_ENABLED:-0}
      FIDELIZA_STANDALONE_MEMBERSHIP_ENABLED: ${FIDELIZA_STANDALONE_MEMBERSHIP_ENABLED:-0}
      FIDELIZA_MERCHANT_SIGNUP_ENABLED: ${FIDELIZA_MERCHANT_SIGNUP_ENABLED:-0}
      FIDELIZA_EMAIL_DELIVERY_ENABLED: ${FIDELIZA_EMAIL_DELIVERY_ENABLED:-0}
      FIDELIZA_PUBLIC_BASE_URL: ${FIDELIZA_PUBLIC_BASE_URL:-}
      FIDELIZA_NUVEMSHOP_CUSTOMERS_PREVIEW_ENABLED: ${FIDELIZA_NUVEMSHOP_CUSTOMERS_PREVIEW_ENABLED:-0}
      FIDELIZA_NUVEMSHOP_ORDERS_PREVIEW_ENABLED: ${FIDELIZA_NUVEMSHOP_ORDERS_PREVIEW_ENABLED:-0}
      FIDELIZA_NUVEMSHOP_ORDER_WEBHOOKS_ENABLED: ${FIDELIZA_NUVEMSHOP_ORDER_WEBHOOKS_ENABLED:-0}
      FIDELIZA_PARTICIPANT_APPROVAL_ENABLED: ${FIDELIZA_PARTICIPANT_APPROVAL_ENABLED:-0}
      FIDELIZA_AUTO_CUSTOMER_LINK_ENABLED: ${FIDELIZA_AUTO_CUSTOMER_LINK_ENABLED:-0}
    depends_on:
      redis:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        python manage.py migrate --noinput
        exec gunicorn config.wsgi:application --workers 1 --threads 2 --bind 0.0.0.0:8000 --access-logfile - --access-logformat '%(h)s %(U)s %(s)s'
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/ready/', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(r, timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *bounded_logs

  worker:
    build: ./backend
    restart: unless-stopped
    # Celery nao precisa de root; elimina SecurityWarning e reduz privilegios.
    user: "65534:65534"
    networks: [app, database]
    mem_limit: 256m
    cpus: 0.25
    environment:
      <<: *django_env
      HOME: /tmp
      # Credenciais SMTP somente no worker; API nunca recebe EMAIL_HOST_PASSWORD.
      FIDELIZA_EMAIL_DELIVERY_ENABLED: ${FIDELIZA_EMAIL_DELIVERY_ENABLED:-0}
      FIDELIZA_PUBLIC_BASE_URL: ${FIDELIZA_PUBLIC_BASE_URL:-}
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: "587"
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: "1"
      EMAIL_USE_SSL: "0"
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      # O email técnico usa o mesmo remetente, sem variável duplicada.
      SERVER_EMAIL: ${DEFAULT_FROM_EMAIL:-}
    depends_on:
      api:
        condition: service_healthy
    command: celery -A config worker --loglevel=INFO --concurrency=1
    logging: *bounded_logs

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [app, proxy]
    # Somente frontend tem rota publica no Traefik.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${FIDELIZA_PROXY_NETWORK:-coolify}"
      - "traefik.http.services.fideliza-homolog.loadbalancer.server.port=8080"
      - "traefik.http.routers.fideliza-homolog-https.rule=Host(`fideliza-homolog.optarys.com.br`) || Host(`www.fideliza-homolog.optarys.com.br`)"
      - "traefik.http.routers.fideliza-homolog-https.entrypoints=https"
      - "traefik.http.routers.fideliza-homolog-https.tls=true"
      - "traefik.http.routers.fideliza-homolog-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.fideliza-homolog-https.service=fideliza-homolog"
      - "traefik.http.routers.fideliza-homolog-http.rule=Host(`fideliza-homolog.optarys.com.br`) || Host(`www.fideliza-homolog.optarys.com.br`)"
      - "traefik.http.routers.fideliza-homolog-http.entrypoints=http"
      - "traefik.http.routers.fideliza-homolog-http.middlewares=fideliza-homolog-redirect"
      - "traefik.http.routers.fideliza-homolog-http.service=fideliza-homolog"
      - "traefik.http.middlewares.fideliza-homolog-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.fideliza-homolog-redirect.redirectscheme.permanent=true"
    mem_limit: 128m
    cpus: 0.10
    expose:
      - "8080"
    depends_on:
      api:
        condition: service_healthy
    logging: *bounded_logs

# Redis somente na rede app interna. DB somente API/worker.
# Proxy publico somente frontend. Nao publicar ports no host.
networks:
  app:
    internal: true
  database:
    external: true
    name: ${FIDELIZA_DB_NETWORK:?Informe o nome real da rede Docker privada do PostgreSQL externo}
  proxy:
    external: true
    name: ${FIDELIZA_PROXY_NETWORK:-coolify}

volumes:
  fideliza_redis_data:
